<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Share Your Location</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px; max-width: 720px; margin: 0 auto; }
    button { font-size: 16px; padding: 12px 16px; cursor: pointer; }
    .hint { color: #555; margin-top: 8px; }
    .box { margin-top: 16px; padding: 12px; border: 1px solid #ddd; border-radius: 10px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>
<body>
  <h1>Share Your Location</h1>
  <p>For your safety, we need to know where you are in case of emergency. Your location will be stored securely and only used if needed.</p>

  <button id="shareBtn" type="button">Share My Location</button>
  <div class="hint">If you don’t see a permission pop-up, your browser may have location blocked for this site.</div>

  <div id="status" class="box">Status: <span class="mono">waiting…</span></div>
  <div id="result" class="box" style="display:none;">
    <div><strong>Latitude:</strong> <span id="lat" class="mono"></span></div>
    <div><strong>Longitude:</strong> <span id="lng" class="mono"></span></div>
    <div><strong>Accuracy (m):</strong> <span id="acc" class="mono"></span></div>
  </div>

  <script>
    const btn = document.getElementById("shareBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const latEl = document.getElementById("lat");
    const lngEl = document.getElementById("lng");
    const accEl = document.getElementById("acc");

    function setStatus(msg) {
      statusEl.innerHTML = `Status: <span class="mono">${msg}</span>`;
      console.log("[geo]", msg);
    }

    function explainError(err) {
      // https://developer.mozilla.org/en-US/docs/Web/API/GeolocationPositionError
      if (!err) return "Unknown error";
      if (err.code === 1) return "Permission denied (you clicked Block or browser is blocking location).";
      if (err.code === 2) return "Position unavailable (GPS/network couldn’t get a fix).";
      if (err.code === 3) return "Timed out trying to get location.";
      return err.message || "Unknown error";
    }

    async function postToWebhook(payload) {
      // OPTIONAL: paste your Make.com webhook URL here if you want to send data
      // const WEBHOOK_URL = "https://hook.us2.make.com/9yl94v50b23lklcnxcc82i622ulb65zf";
      const WEBHOOK_URL = ""; // leave blank to only display location on-page

      if (!WEBHOOK_URL) return;

      setStatus("sending to webhook…");
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const text = await res.text().catch(() => "");
        throw new Error(`Webhook error: ${res.status} ${res.statusText} ${text}`.trim());
      }
      setStatus("sent to webhook ✅");
    }

    btn.addEventListener("click", () => {
      setStatus("button clicked… requesting location permission");

      if (!("geolocation" in navigator)) {
        setStatus("geolocation not supported in this browser");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          latEl.textContent = latitude;
          lngEl.textContent = longitude;
          accEl.textContent = accuracy;

          resultEl.style.display = "block";
          setStatus("location captured ✅");

          try {
            await postToWebhook({
              latitude,
              longitude,
              accuracy,
              captured_at: new Date().toISOString(),
              user_agent: navigator.userAgent,
              page: location.href
            });
          } catch (e) {
            console.error(e);
            setStatus(`captured, but webhook failed ❌ (${e.message})`);
          }
        },
        (err) => {
          const msg = explainError(err);
          console.warn(err);
          setStatus(`failed ❌ (${msg})`);
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    });
  </script>
</body>
</html>
